<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a night-blue game cabinet. Shelf of tiles → one game per screen, sticky top bar. */
:root {
  color-scheme: dark;
  --bg: #0f1a30;
  --panel: #16243f;
  --card: #1c2e50;
  --card-hi: #25395f;
  --line: #2b4270;
  --text: #eef1f7;
  --dim: #93a1bd;
  --gold: #e8b931;
  --gold-dark: #a8741a;
  --gold-ink: #4a3208;
  --mint: #5ad1a6;
  --mint-ink: #0d2a20;
  --miss: #e08a7b;
  --red-ans: #ef7d62;
  --blue-ans: #5aa9e6;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 14px;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.1; margin: 0; text-wrap: balance; }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 0 40px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.dim { color: var(--dim); }
.btn {
  border: 0; border-radius: 12px; padding: 12px 20px; min-height: 46px;
  background: var(--card-hi); color: var(--text); font-weight: 700;
}
.btn:hover { background: var(--line); }
.btn.primary { background: var(--mint); color: var(--mint-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.big { font-size: 1.15rem; padding: 16px 28px; min-height: 58px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--dim); }
.field select, .field input {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 10px; min-height: 42px; color: var(--text); font-size: 1rem;
}

/* ---------- shelf ---------- */
.shelf-head { display: flex; align-items: center; gap: 16px; padding-block: 28px 20px; flex-wrap: wrap; }
.shelf-head img { width: 64px; height: 64px; }
.shelf-head h1 { font-size: clamp(2rem, 6vw, 2.9rem); font-weight: 800; letter-spacing: -.01em; }
.shelf-head .count { color: var(--dim); }
.shelf-head .grow { flex: 1; min-width: 0; }
.seg { display: inline-flex; background: var(--panel); border-radius: 12px; padding: 4px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--dim); padding: 8px 14px; border-radius: 9px; font-weight: 700; min-height: 40px; }
.seg button[aria-pressed="true"] { background: var(--card-hi); color: var(--text); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px; }
.tile {
  display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
  padding: 18px 14px 16px; background: var(--card); border: 0; border-radius: 18px; color: var(--text);
  transition: background .15s, transform .15s;
}
.tile:hover { background: var(--card-hi); transform: translateY(-2px); }
.tile svg { width: 112px; height: 112px; max-width: 100%; }
.tile .t { font-family: var(--f-display); font-weight: 600; font-size: 1.1rem; }
.tile .p { color: var(--dim); font-size: .85rem; }
.list { display: flex; flex-direction: column; gap: 10px; }
.row {
  display: flex; align-items: center; gap: 16px; padding: 12px 14px; background: var(--card);
  border-radius: 16px; border: 0; text-align: left; color: var(--text); width: 100%;
}
.row:hover { background: var(--card-hi); }
.row svg { width: 60px; height: 60px; flex: none; }
.row .info { flex: 1; min-width: 0; }
.row .t { font-family: var(--f-display); font-weight: 600; font-size: 1.12rem; }
.row .p { color: var(--dim); font-size: .85rem; margin-left: 6px; font-family: var(--f-body); font-weight: 400; }
.row .d { color: var(--dim); font-size: .92rem; }
.row .play { flex: none; background: var(--mint); color: var(--mint-ink); font-weight: 700; padding: 9px 18px; border-radius: 10px; }
.shelf-foot { color: var(--dim); font-size: .85rem; margin-top: 28px; }

/* ---------- game frame ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; align-items: center; gap: 12px; padding-block: 12px; border-bottom: 1px solid var(--panel);
}
.topbar h2 { font-size: 1.3rem; font-weight: 600; flex: 1; min-width: 0; }
.back { border: 0; background: var(--panel); color: var(--text); border-radius: 10px; padding: 8px 14px; min-height: 40px; font-weight: 700; }
.stage { padding-top: 18px; }

/* ---------- coins in a line ---------- */
.ctrls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; background: var(--panel); padding: 12px 14px; border-radius: var(--r); }
.ctrls .field { min-width: 0; }
.ctrls .btn { margin-left: auto; }
.board { position: relative; margin-top: 16px; display: flex; flex-direction: column; gap: 14px; }
.tray { background: var(--card); border-radius: var(--r); padding: 12px 14px; display: flex; gap: 14px; align-items: center; min-height: 92px; }
.tray .who { flex: none; width: 104px; position: relative; }
.tray .name { color: var(--dim); font-weight: 700; font-size: .95rem; transition: color .2s; }
.tray .name.active { color: var(--mint); }
.tray .score { font-family: var(--f-mono); font-weight: 700; font-size: 1.9rem; line-height: 1.1; }
.tray .haul { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 4px; align-content: center; }
.status { text-align: center; min-height: 1.5em; font-size: 1.05rem; }
.pile-area { display: flex; justify-content: center; padding-block: 6px; min-height: 120px; }
.pile { display: flex; flex-wrap: wrap; gap: var(--g, 8px); align-content: flex-start; }
.coin {
  width: var(--s, 56px); height: var(--s, 56px); border-radius: 50%; flex: none;
  display: grid; place-items: center; user-select: none;
  background: radial-gradient(circle at 50% 50%, var(--gold) 60%, #d9a92a 61%, var(--gold) 66%);
  box-shadow: inset 0 0 0 2px var(--gold-dark), 0 3px 0 var(--gold-dark);
  color: var(--gold-ink); font-family: var(--f-mono); font-weight: 700; font-size: calc(var(--s, 56px) * .38);
  border: 0; padding: 0; transition: transform .15s, box-shadow .15s;
}
.coin.end { box-shadow: inset 0 0 0 2px var(--gold-dark), 0 3px 0 var(--gold-dark), 0 0 0 3px var(--text); cursor: pointer; }
.coin.end:hover, .coin.end:focus-visible { transform: translateY(-6px); }
.haul .coin { width: var(--ts, 28px); height: var(--ts, 28px); font-size: calc(var(--ts, 28px) * .42); box-shadow: inset 0 0 0 1.5px var(--gold-dark); }
.pop { position: absolute; left: 66px; top: 22px; color: var(--mint); font-weight: 700; font-family: var(--f-mono); pointer-events: none; }
.result {
  position: absolute; inset: 0; display: grid; place-items: center; background: rgba(15, 26, 48, .72);
  border-radius: var(--r);
}
.result .card { background: var(--panel); border: 2px solid var(--mint); border-radius: 18px; padding: 24px 28px; text-align: center; display: grid; gap: 10px; max-width: 92%; }
.result h3 { font-size: clamp(1.8rem, 7vw, 2.6rem); font-weight: 800; }

/* ---------- two rooms ---------- */
.room { max-width: 640px; margin: 0 auto; display: grid; gap: 18px; }
.panel { background: var(--panel); border-radius: var(--r); padding: 18px; }
.panel h3 { font-size: 1.25rem; font-weight: 600; margin-bottom: 8px; }
.rules { display: grid; gap: 10px; }
.rules p { margin: 0; }
.case-table { width: 100%; border-collapse: collapse; font-size: .95rem; }
.case-table th, .case-table td { padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--line); }
.case-table th { color: var(--dim); font-weight: 700; font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; }
.case-table td.num, .case-table th.num { text-align: right; }
.setup-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.note { border-left: 3px solid var(--gold); padding: 6px 0 6px 12px; color: var(--dim); }
details.panel summary { cursor: pointer; font-weight: 700; font-family: var(--f-display); font-size: 1.1rem; }
details.panel[open] summary { margin-bottom: 12px; }
.strat { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px 10px; align-items: center; }
.strat .h { color: var(--dim); font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.strat select, .strat input { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-height: 40px; min-width: 0; width: 100%; }
.center { text-align: center; display: grid; gap: 14px; justify-items: center; }
.handoff { padding-block: 40px; }
.handoff .big-name { font-family: var(--f-display); font-weight: 800; font-size: clamp(2.2rem, 9vw, 3.4rem); }
.round-tag { color: var(--dim); font-family: var(--f-mono); font-size: .9rem; }
.flip { width: 132px; height: 132px; perspective: 600px; }
.flip .inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; animation: flip .7s ease-out; }
@keyframes flip { from { transform: rotateY(900deg); } to { transform: rotateY(0); } }
.face {
  position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; backface-visibility: hidden;
  background: radial-gradient(circle, #f0f0f0 58%, #c9ccd6 60%, #e4e6ec 66%); color: #22304e;
  box-shadow: inset 0 0 0 3px #9aa1b4; font-family: var(--f-display); font-weight: 800; font-size: 1.5rem;
}
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
.ans { border: 0; border-radius: 16px; min-height: 96px; font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; color: #10182a; }
.ans.red { background: var(--red-ans); }
.ans.blue { background: var(--blue-ans); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-weight: 700; }
.chip.red { background: var(--red-ans); color: #10182a; }
.chip.blue { background: var(--blue-ans); color: #10182a; }
.chip.coin-h, .chip.coin-t { background: #e4e6ec; color: #22304e; }
.reveal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.reveal-grid .panel { display: grid; gap: 8px; justify-items: start; }
.verdict { font-family: var(--f-display); font-weight: 800; font-size: 2rem; }
.verdict.win { color: var(--mint); }
.verdict.miss { color: var(--miss); }
.dial-wrap { display: grid; justify-items: center; gap: 10px; width: 100%; }
.dial { width: min(260px, 72vw); height: auto; touch-action: none; cursor: grab; }
.dial-read { font-family: var(--f-mono); font-size: 1.4rem; font-weight: 700; }
.nudges { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.nudges button { border: 0; background: var(--card-hi); border-radius: 9px; min-width: 52px; min-height: 40px; font-family: var(--f-mono); }
.dial-wrap input[type=range] { width: min(300px, 80vw); accent-color: var(--mint); }
.meter { position: relative; height: 26px; background: var(--card); border-radius: 8px; overflow: visible; margin-top: 36px; margin-bottom: 30px; }
.meter .fill { position: absolute; inset: 0 auto 0 0; background: var(--mint); border-radius: 8px; }
.meter .mark { position: absolute; top: -8px; bottom: -8px; width: 2px; background: var(--text); }
.meter .mark span { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: .75rem; color: var(--dim); }
.meter .mark.top span { bottom: calc(100% + 2px); }
.meter .mark.bot span { top: calc(100% + 2px); }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--card); border-radius: 12px; padding: 12px 14px; }
.stat .k { color: var(--dim); font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
.stat .v { font-family: var(--f-mono); font-size: 1.5rem; font-weight: 700; }
.big-rate { font-family: var(--f-mono); font-weight: 700; font-size: clamp(3rem, 14vw, 4.6rem); line-height: 1; }
.scroll-x { overflow-x: auto; }
.log { font-family: var(--f-mono); font-size: .85rem; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>

/* ================================================================ router + shelf */
const app = $("#app");
let current = null;

function route() {
  if (current && current.unmount) current.unmount();
  current = null;
  const id = location.hash.slice(1);
  const game = GAMES.find((g) => g.id === id);
  window.scrollTo(0, 0);
  app.style.maxWidth = game && game.wide ? "1380px" : "";
  if (!game) return renderShelf();
  app.innerHTML = "";
  const bar = h(`<div class="topbar"><button class="back" id="back-btn">← Shelf</button><h2>${esc(game.title)}</h2></div>`);
  const stage = h(`<div class="stage"></div>`);
  app.append(bar, stage);
  $("#back-btn").onclick = () => { location.hash = ""; };
  current = game.mount(stage);
  document.title = game.title + " · Game Shelf";
}

function renderShelf() {
  document.title = "Game Shelf";
  const view = store.get("view", "grid");
  app.innerHTML = `
    <header class="shelf-head">
      <img src="${ICON}" alt="">
      <div class="grow"><h1>Game Shelf</h1><div class="count">${GAMES.length} games</div></div>
      <div class="seg" role="group" aria-label="View">
        <button id="v-list" aria-pressed="${view === "list"}">☰ List</button>
        <button id="v-grid" aria-pressed="${view === "grid"}">▦ Grid</button>
      </div>
    </header>
    <main id="shelf"></main>
    <p class="shelf-foot">Game theory, one small game at a time.</p>`;
  const shelf = $("#shelf");
  if (view === "grid") {
    shelf.className = "grid";
    shelf.innerHTML = GAMES.map((g) => `<button class="tile" data-id="${g.id}" title="${esc(g.description)}">${g.icon}<span class="t">${esc(g.title)}</span><span class="p">${esc(g.players)}</span></button>`).join("");
  } else {
    shelf.className = "list";
    shelf.innerHTML = GAMES.map((g) => `<button class="row" data-id="${g.id}">${g.icon}<span class="info"><span class="t">${esc(g.title)}<span class="p">· ${esc(g.players)}</span></span><br><span class="d">${esc(g.description)}</span></span><span class="play">Play</span></button>`).join("");
  }
  shelf.onclick = (e) => { const b = e.target.closest("[data-id]"); if (b) location.hash = b.dataset.id; };
  $("#v-list").onclick = () => { store.set("view", "list"); renderShelf(); };
  $("#v-grid").onclick = () => { store.set("view", "grid"); renderShelf(); };
}

/* ================================================================ Coins in a Line */
function greedyMove(c) { return c[0] >= c[c.length - 1] ? "L" : "R"; }
function optimalMove(c) {
  // adv[i][j] = best (mover - opponent) margin on c[i..j] with perfect play
  const n = c.length;
  if (n === 1) return "L";
  const adv = Array.from({ length: n }, () => new Float64Array(n));
  for (let i = 0; i < n; i++) adv[i][i] = c[i];
  for (let len = 2; len <= n; len++)
    for (let i = 0; i + len - 1 < n; i++) {
      const j = i + len - 1;
      adv[i][j] = Math.max(c[i] - adv[i + 1][j], c[j] - adv[i][j - 1]);
    }
  return c[0] - adv[1][n - 1] >= c[n - 1] - adv[0][n - 2] ? "L" : "R";
}

function coinsGame(root) {
  const saved = store.get("coins.settings", { mode: "ai", diff: "hard", first: "you", n: 10 });
  root.innerHTML = `
    <div class="ctrls">
      <label class="field">Mode<select id="c-mode"><option value="ai">vs Computer</option><option value="pvp">2 Players</option></select></label>
      <label class="field">Difficulty<select id="c-diff"><option value="easy">Easy</option><option value="hard">Hard</option></select></label>
      <label class="field">First<select id="c-first"><option value="you">You</option><option value="cpu">Computer</option></select></label>
      <label class="field">Coins<input id="c-n" type="number" min="2" max="100" inputmode="numeric" style="width:84px"></label>
      <button class="btn primary" id="c-new">New game</button>
    </div>
    <div class="board" id="c-board">
      <div class="tray" id="tray-top"><div class="who"><div class="name"></div><div class="score">0</div></div><div class="haul"></div></div>
      <div class="status" id="c-status" aria-live="polite"></div>
      <div class="pile-area" id="c-area"><div class="pile" id="c-pile"></div></div>
      <div class="tray" id="tray-bot"><div class="who"><div class="name"></div><div class="score">0</div></div><div class="haul"></div></div>
    </div>`;
  const el = { mode: $("#c-mode", root), diff: $("#c-diff", root), first: $("#c-first", root), n: $("#c-n", root) };
  el.mode.value = saved.mode; el.diff.value = saved.diff; el.first.value = saved.first; el.n.value = saved.n;
  const sync = () => { const ai = el.mode.value === "ai"; el.diff.disabled = !ai; el.first.disabled = !ai; };
  el.mode.onchange = sync; sync();

  const board = $("#c-board", root), pile = $("#c-pile", root), area = $("#c-area", root), statusEl = $("#c-status", root);
  const trays = { top: $("#tray-top", root), bot: $("#tray-bot", root) };
  let S = null, gen = 0;
  const later = (ms, fn) => { const g = gen; setTimeout(() => { if (g === gen) fn(); }, REDUCED ? 0 : ms); };

  function layout() {
    if (!S) return;
    const n0 = S.n0, W = area.clientWidth, maxH = Math.max(200, innerHeight * 0.42);
    let s = 64, g = 8, per = 1, rows = 1;
    for (s = 64; s >= 22; s--) {
      g = Math.max(4, Math.round(s * 0.16));
      per = Math.max(1, Math.floor((W + g) / (s + g)));
      rows = Math.ceil(n0 / per);
      if (rows * (s + g) <= maxH) break;
    }
    if (s < 22) {               // nothing fit: use the smallest size and let the page scroll
      s = 22; g = 4; per = Math.max(1, Math.floor((W + g) / (s + g))); rows = Math.ceil(n0 / per);
    }
    per = Math.ceil(n0 / rows);
    pile.style.setProperty("--s", s + "px"); pile.style.setProperty("--g", g + "px");
    pile.style.width = per * (s + g) - g + "px";
    const hw = trays.bot.querySelector(".haul").clientWidth, m = Math.ceil(n0 / 2);
    let ts = Math.min(s, 44);
    for (; ts > 16; ts--) { const perT = Math.max(1, Math.floor((hw + 4) / (ts + 4))); if (Math.ceil(m / perT) <= 2) break; }
    board.style.setProperty("--ts", ts + "px");
  }

  function newGame() {
    gen++;
    let n = parseInt(el.n.value, 10); if (!(n >= 2)) n = 10; n = Math.min(100, n); el.n.value = n;
    const mode = el.mode.value, ai = mode === "ai";
    store.set("coins.settings", { mode, diff: el.diff.value, first: el.first.value, n });
    const aiFirst = ai && el.first.value === "cpu";
    S = {
      n0: n, coins: [], scores: [0, 0], turn: 0, locked: true,
      ai: ai ? (el.diff.value === "hard" ? optimalMove : greedyMove) : null,
      aiSeat: ai ? (aiFirst ? 0 : 1) : -1,
      names: ai ? (aiFirst ? ["Computer", "You"] : ["You", "Computer"]) : ["Player 1", "Player 2"],
    };
    S.seatTray = ai ? (aiFirst ? ["top", "bot"] : ["bot", "top"]) : ["bot", "top"];
    board.querySelector(".result")?.remove();
    for (const seat of [0, 1]) {
      const t = trays[S.seatTray[seat]];
      t.querySelector(".name").textContent = S.names[seat];
      t.querySelector(".score").textContent = "0";
      t.querySelector(".haul").innerHTML = "";
    }
    pile.innerHTML = "";
    layout();
    const stag = Math.min(30, 1200 / n);
    for (let k = 0; k < n; k++) {
      const v = 1 + Math.floor(Math.random() * 25);
      const c = h(`<button class="coin" tabindex="-1">${v}</button>`);
      c.addEventListener("click", () => onCoin(c));
      pile.append(c);
      S.coins.push({ v, el: c });
      if (!REDUCED) c.animate([{ transform: "translateY(-40px) scale(.6)", opacity: 0 }, { transform: "none", opacity: 1 }],
        { duration: 380, delay: k * stag, easing: "cubic-bezier(.2,.8,.3,1)", fill: "backwards" });
    }
    statusEl.textContent = "Dealing…";
    later(n * stag + 400, nextTurn);
  }

  const humanTurn = () => S && S.coins.length && !S.locked && S.turn !== S.aiSeat;
  function markEnds() {
    S.coins.forEach((c) => { c.el.classList.remove("end"); c.el.tabIndex = -1; c.el.removeAttribute("aria-label"); });
    if (!humanTurn()) return;
    const ends = [S.coins[0], S.coins[S.coins.length - 1]];
    ends.forEach((c, i) => { c.el.classList.add("end"); c.el.tabIndex = 0; c.el.setAttribute("aria-label", `Take ${i ? "right" : "left"} coin, ${c.v}`); });
  }
  function setActive() {
    for (const seat of [0, 1]) trays[S.seatTray[seat]].querySelector(".name").classList.toggle("active", seat === S.turn && S.coins.length > 0);
  }
  function nextTurn() {
    if (!S.coins.length) return endGame();
    setActive();
    if (S.turn === S.aiSeat) {
      S.locked = true; markEnds();
      statusEl.textContent = "Computer is thinking…";
      later(650, () => take(S.ai(S.coins.map((c) => c.v))));
    } else {
      S.locked = false;
      statusEl.textContent = S.ai ? "Your turn. Tap an end coin (or press ← / →)." : `${S.names[S.turn]}'s turn. Tap an end coin.`;
      markEnds();
    }
  }
  function onCoin(c) {
    if (!humanTurn()) return;
    if (c === S.coins[0].el) take("L"); else if (c === S.coins[S.coins.length - 1].el) take("R");
  }
  function take(side) {
    S.locked = true; markEnds();
    const idx = side === "L" ? 0 : S.coins.length - 1;
    const coin = S.coins.splice(idx, 1)[0], seat = S.turn;
    const first = S.coins.map((c) => c.el.getBoundingClientRect());
    const fr = coin.el.getBoundingClientRect();
    const tray = trays[S.seatTray[seat]];
    tray.querySelector(".haul").append(coin.el);
    const lr = coin.el.getBoundingClientRect();
    const D = REDUCED ? 0 : 480;
    if (D) {
      const dx = fr.left + fr.width / 2 - (lr.left + lr.width / 2), dy = fr.top + fr.height / 2 - (lr.top + lr.height / 2);
      coin.el.animate([{ transform: `translate(${dx}px, ${dy}px) scale(${fr.width / lr.width})` }, { transform: "none" }],
        { duration: D, easing: "cubic-bezier(.3,.7,.2,1)" });
      S.coins.forEach((c, i) => {
        const r = c.el.getBoundingClientRect(), ddx = first[i].left - r.left, ddy = first[i].top - r.top;
        if (ddx || ddy) c.el.animate([{ transform: `translate(${ddx}px, ${ddy}px)` }, { transform: "none" }], { duration: 360, easing: "ease-out" });
      });
    }
    later(D, () => {
      S.scores[seat] += coin.v;
      tray.querySelector(".score").textContent = S.scores[seat];
      const pop = h(`<span class="pop">+${coin.v}</span>`);
      tray.querySelector(".who").append(pop);
      pop.animate([{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(-26px)", opacity: 0 }], { duration: REDUCED ? 1 : 700 }).onfinish = () => pop.remove();
      S.turn ^= 1;
      nextTurn();
    });
  }
  function endGame() {
    setActive();
    statusEl.textContent = "";
    const [a, b] = S.scores;
    const msg = a === b ? "Tie!" : (a > b ? S.names[0] : S.names[1]) === "You" ? "You win!" : `${a > b ? S.names[0] : S.names[1]} wins!`;
    const r = h(`<div class="result"><div class="card"><h3>${msg}</h3><div class="num dim">${S.names[0]} ${a} – ${b} ${S.names[1]}</div><button class="btn primary">Play again</button></div></div>`);
    r.querySelector("button").onclick = newGame;
    board.append(r);
    if (!REDUCED) r.querySelector(".card").animate([{ transform: "translateY(-30px)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 400, easing: "ease-out" });
  }
  const onKey = (e) => {
    if (!humanTurn() || e.target.matches("input, select")) return;
    if (e.key === "ArrowLeft") { e.preventDefault(); take("L"); }
    if (e.key === "ArrowRight") { e.preventDefault(); take("R"); }
  };
  const onResize = () => layout();
  addEventListener("keydown", onKey);
  addEventListener("resize", onResize);
  $("#c-new", root).onclick = newGame;
  newGame();
  return { unmount() { gen++; removeEventListener("keydown", onKey); removeEventListener("resize", onResize); } };
}

/* ================================================================ Two Rooms (CHSH) */
const CLASSICAL_LIMIT = 0.75;
const QUANTUM_LIMIT = Math.cos(Math.PI / 8) ** 2; // 0.8536, Tsirelson
const COIN = ["Heads", "Tails"];
const COLOR = ["Red", "Blue"];
const needDiffer = (x, y) => x === 1 && y === 1;
const wins = (x, y, a, b) => (a !== b) === needDiffer(x, y);
const flip = () => (Math.random() < 0.5 ? 0 : 1);
// Shared |Φ+> pair measured along real angles θA, θB: P(same outcome) = cos²(θA − θB).
const pSame = (ta, tb) => Math.cos(((ta - tb) * Math.PI) / 180) ** 2;

function binomTail(n, k, p) { // P(X >= k), X ~ Bin(n, p)
  if (k <= 0) return 1;
  if (k > n) return 0;
  const lr = Math.log(p / (1 - p));
  let lp = n * Math.log(1 - p), terms = [];
  for (let i = 0; i <= n; i++) {
    if (i >= k) terms.push(lp);
    lp += Math.log((n - i) / (i + 1)) + lr;
  }
  const m = Math.max(...terms);
  return Math.min(1, Math.exp(m) * terms.reduce((s, t) => s + Math.exp(t - m), 0));
}
const pct = (x, d = 1) => (100 * x).toFixed(d) + "%";

function roomsGame(root, quantum) {
  const key = quantum ? "entangled" : "rooms";
  const prefs = store.get(key + ".prefs", { names: ["Alice", "Bob"], rounds: 20 });
  let S = null;

  function chip(kind, i) { return kind === "coin" ? `<span class="chip ${i ? "coin-t" : "coin-h"}">${COIN[i]}</span>` : `<span class="chip ${i ? "blue" : "red"}">${COLOR[i]}</span>`; }

  /* ---------- setup ---------- */
  function setup() {
    root.innerHTML = `<div class="room">
      <section class="panel rules">
        <h3>How it works</h3>
        <p>You and your partner each sit in a separate room. Every round, each of you flips your own coin and sees only your own result. Then ${quantum
          ? "each of you sets a dial and measures your half of a shared entangled pair. The measurement comes out <b>Red</b> or <b>Blue</b> at random, but your two results are correlated in a way that depends on both dials."
          : "each of you answers <b>Red</b> or <b>Blue</b>."}</p>
        <div class="scroll-x"><table class="case-table">
          <thead><tr><th>Coins</th><th>You score if your colors…</th></tr></thead>
          <tbody><tr><td>Heads + Heads</td><td>match</td></tr><tr><td>Heads + Tails</td><td>match</td></tr><tr><td>Tails + Heads</td><td>match</td></tr><tr><td>Tails + Tails</td><td><b>differ</b></td></tr></tbody>
        </table></div>
        <p class="note">Plan your strategy together now. Once round one starts, no talking, no signals.</p>
      </section>
      ${quantum ? `<details class="panel"><summary>The physics of the pair</summary>
        <p>Each round you share a fresh pair of particles in the entangled state |Φ⁺⟩. Your dial sets the angle θ you measure your particle along (0°–180°). Each result on its own is a fair 50/50 coin, but the two results agree with probability</p>
        <p class="num" style="text-align:center;font-size:1.2rem">P(same color) = cos²(θ<sub>A</sub> − θ<sub>B</sub>)</p>
        <p class="dim">Whoever measures first gets a random color; the other's result is then drawn from that rule. No information passes between rooms: the result alone tells you nothing about your partner's coin or dial.</p></details>` : ""}
      <section class="panel" style="display:grid;gap:14px">
        <div class="setup-row">
          <label class="field">Player A<input id="r-a" maxlength="16" value="${esc(prefs.names[0])}"></label>
          <label class="field">Player B<input id="r-b" maxlength="16" value="${esc(prefs.names[1])}"></label>
          <label class="field">Rounds<input id="r-n" type="number" min="1" max="500" inputmode="numeric" value="${prefs.rounds}"></label>
        </div>
        <button class="btn primary big" id="r-start">Start round 1</button>
      </section>
      <details class="panel"><summary>Test a strategy</summary>
        <p class="dim" style="margin-top:0">Hand-played games are short, so luck is large. Write down a fixed strategy for each player and run it for many rounds at once.</p>
        <div class="strat">
          <span></span><span class="h">If my coin is Heads</span><span class="h">If my coin is Tails</span>
          ${[0, 1].map((p) => `<span class="h">${p ? "Player B" : "Player A"}</span>${[0, 1].map((x) => quantum
            ? `<input id="s-${p}${x}" type="number" step="0.5" min="0" max="180" value="0" aria-label="Player ${p ? "B" : "A"} angle for ${COIN[x]}">`
            : `<select id="s-${p}${x}" aria-label="Player ${p ? "B" : "A"} answer for ${COIN[x]}"><option value="0">Red</option><option value="1">Blue</option></select>`).join("")}`).join("")}
        </div>
        <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:14px">
          <label class="field">Rounds to simulate<input id="s-n" type="number" min="10" max="100000" value="2000" inputmode="numeric" style="width:120px"></label>
          <button class="btn" id="s-run">Run strategy</button>
        </div>
        ${quantum ? '<p class="dim" style="margin-bottom:0">Angles in degrees.</p>' : ""}
      </details>
    </div>`;
    const saveNames = () => {
      const names = [$("#r-a", root).value.trim() || "Player A", $("#r-b", root).value.trim() || "Player B"];
      let n = parseInt($("#r-n", root).value, 10); if (!(n >= 1)) n = 20; n = Math.min(500, n);
      store.set(key + ".prefs", { names, rounds: n });
      return { names, n };
    };
    $("#r-start", root).onclick = () => {
      const { names, n } = saveNames();
      S = { names, total: n, history: [], lastAngle: [0, 0], cur: null, simulated: false };
      startRound();
    };
    $("#s-run", root).onclick = () => {
      const { names } = saveNames();
      let n = parseInt($("#s-n", root).value, 10); if (!(n >= 10)) n = 2000; n = Math.min(100000, n);
      const strat = [0, 1].map((p) => [0, 1].map((x) => parseFloat($(`#s-${p}${x}`, root).value) || 0));
      const history = [];
      for (let i = 0; i < n; i++) {
        const x = flip(), y = flip();
        let a, b, ta, tb;
        if (quantum) { ta = strat[0][x]; tb = strat[1][y]; a = flip(); b = Math.random() < pSame(ta, tb) ? a : 1 - a; }
        else { a = strat[0][x]; b = strat[1][y]; }
        history.push({ x, y, a, b, ta, tb });
      }
      S = { names, total: n, history, simulated: true, strat };
      results();
    };
  }

  /* ---------- rounds ---------- */
  function startRound() {
    S.cur = { x: flip(), y: flip() };
    handoff(0);
  }
  function roundTag() { return `Round ${S.history.length + 1} of ${S.total}`; }
  function handoff(p) {
    const other = S.names[1 - p];
    root.innerHTML = `<div class="room"><div class="center handoff">
      <div class="round-tag">${roundTag()}</div>
      <div class="dim">Pass the device to</div>
      <div class="big-name">${esc(S.names[p])}</div>
      <div class="dim">${esc(other)}, look away until called.</div>
      <button class="btn primary big" id="go">I'm ${esc(S.names[p])}, show my coin</button>
    </div></div>`;
    $("#go", root).onclick = () => privateTurn(p);
  }
  function privateTurn(p) {
    const x = p ? S.cur.y : S.cur.x;
    root.innerHTML = `<div class="room"><div class="center">
      <div class="round-tag">${roundTag()} · ${esc(S.names[p])}'s room</div>
      <div class="dim">Your coin landed</div>
      <div class="flip"><div class="inner"><div class="face">${COIN[x]}</div></div></div>
      <div id="act" style="width:100%"></div>
    </div></div>`;
    const act = $("#act", root);
    if (!quantum) {
      act.innerHTML = `<div class="dim" style="margin-bottom:10px">Choose your color</div><div class="answers"><button class="ans red" data-a="0">Red</button><button class="ans blue" data-a="1">Blue</button></div>`;
      act.onclick = (e) => { const b = e.target.closest("[data-a]"); if (b) lockIn(p, +b.dataset.a); };
    } else {
      const dial = makeDial(S.lastAngle[p]);
      act.append(dial.el);
      const m = h(`<button class="btn primary big" style="margin-top:14px">Measure</button>`);
      act.append(m);
      m.onclick = () => {
        const t = dial.value();
        S.lastAngle[p] = t;
        let outcome;
        if (p === 0) { outcome = flip(); S.cur.ta = t; }
        else { S.cur.tb = t; outcome = Math.random() < pSame(S.cur.ta, t) ? S.cur.a : 1 - S.cur.a; }
        lockIn(p, outcome, t);
      };
    }
  }
  function lockIn(p, ans, theta) {
    if (p === 0) S.cur.a = ans; else S.cur.b = ans;
    root.innerHTML = `<div class="room"><div class="center handoff">
      <div class="round-tag">${roundTag()} · ${esc(S.names[p])}'s room</div>
      ${quantum ? `<div class="dim">Measured at <span class="num">${theta}°</span>. Your result:</div>` : `<div class="dim">You chose</div>`}
      <div style="transform:scale(1.6);margin:10px 0">${chip("color", ans)}</div>
      <button class="btn primary big" id="go">${p === 0 ? "Hide this and pass the device" : "Hide this and call " + esc(S.names[0]) + " back"}</button>
    </div></div>`;
    $("#go", root).onclick = () => (p === 0 ? handoff(1) : reveal());
  }
  function reveal() {
    const { x, y, a, b, ta, tb } = S.cur;
    const w = wins(x, y, a, b);
    S.history.push({ x, y, a, b, ta, tb });
    const score = S.history.filter((r) => wins(r.x, r.y, r.a, r.b)).length;
    const side = (p, coin, ans, t) => `<div class="panel"><b>${esc(S.names[p])}</b><div>Coin: ${chip("coin", coin)}</div><div>${quantum ? `Dial: <span class="num">${t}°</span>` : ""}</div><div>Color: ${chip("color", ans)}</div></div>`;
    const done = S.history.length >= S.total;
    root.innerHTML = `<div class="room">
      <div class="center"><div class="round-tag">Round ${S.history.length} of ${S.total}</div>
      <div class="verdict ${w ? "win" : "miss"}">${w ? "Point!" : "No point"}</div>
      <div class="dim">${needDiffer(x, y) ? "Both coins were Tails, so your colors needed to differ." : "At least one coin was Heads, so your colors needed to match."}</div></div>
      <div class="reveal-grid">${side(0, x, a, ta)}${side(1, y, b, tb)}</div>
      <div class="center"><div class="num">Score: ${score} / ${S.history.length} (${pct(score / S.history.length, 0)})</div>
      <button class="btn primary big" id="go">${done ? "See results" : "Next round"}</button></div>
    </div>`;
    $("#go", root).onclick = () => (done ? results() : startRound());
  }

  /* ---------- results ---------- */
  function results() {
    const H = S.history, n = H.length;
    const k = H.filter((r) => wins(r.x, r.y, r.a, r.b)).length;
    const rate = k / n;
    const cells = [[0, 0], [0, 1], [1, 0], [1, 1]].map(([x, y]) => {
      const rs = H.filter((r) => r.x === x && r.y === y);
      const same = rs.filter((r) => r.a === r.b).length;
      const pts = rs.filter((r) => wins(r.x, r.y, r.a, r.b)).length;
      return { x, y, n: rs.length, same, pts, E: rs.length ? (2 * same - rs.length) / rs.length : null };
    });
    const haveAll = cells.every((c) => c.n > 0);
    const Sval = haveAll ? cells[0].E + cells[1].E + cells[2].E - cells[3].E : null;
    const tail = binomTail(n, k, CLASSICAL_LIMIT);
    const luck = rate <= CLASSICAL_LIMIT
      ? `That's at or below the classical limit, so there's nothing to explain.`
      : `If you were playing a perfect classical strategy (75% per round), a score of ${k}/${n} or better would happen ${tail < 0.001 ? "less than 0.1%" : pct(tail)} of the time.${tail < 0.01 ? " That's very unlikely to be luck." : tail < 0.05 ? " Unlikely, but not impossible, to be luck." : " Luck could easily explain it."}`;
    const bench = quantum
      ? `The best possible strategy averages <b>${pct(QUANTUM_LIMIT)}</b> with entanglement. Without it, no strategy can average more than <b>75%</b>.`
      : `The best possible strategy averages <b>75%</b>. No classical strategy can do better on average.`;
    const meterPct = Math.max(0, Math.min(100, rate * 100));
    root.innerHTML = `<div class="room">
      <section class="panel center">
        <div class="round-tag">${S.simulated ? `Simulated: ${n.toLocaleString()} rounds of a fixed strategy` : `${esc(S.names[0])} & ${esc(S.names[1])}, ${n} rounds`}</div>
        <div class="big-rate">${pct(rate)}</div>
        <div class="dim">${k} points in ${n} rounds</div>
      </section>
      <section class="panel">
        <h3>Compared with the limits</h3>
        <div class="meter" role="img" aria-label="Your win rate ${pct(rate)} against the 75% classical and ${pct(QUANTUM_LIMIT)} quantum limits">
          <div class="fill" style="width:${meterPct}%"></div>
          <div class="mark top" style="left:75%"><span>classical 75%</span></div>
          <div class="mark bot" style="left:${QUANTUM_LIMIT * 100}%"><span>quantum ${pct(QUANTUM_LIMIT)}</span></div>
        </div>
        <p style="margin:0">${bench}</p>
        <p class="dim" style="margin-bottom:0">${luck}</p>
      </section>
      <section class="panel">
        <h3>Where the points came from</h3>
        <div class="scroll-x"><table class="case-table">
          <thead><tr><th>Coins (A + B)</th><th>Needed</th><th class="num">Rounds</th><th class="num">Same color</th><th class="num">Points</th></tr></thead>
          <tbody>${cells.map((c) => `<tr><td>${COIN[c.x]} + ${COIN[c.y]}</td><td>${needDiffer(c.x, c.y) ? "differ" : "match"}</td><td class="num">${c.n}</td><td class="num">${c.n ? pct(c.same / c.n, 0) : "–"}</td><td class="num">${c.pts}</td></tr>`).join("")}</tbody>
        </table></div>
        <div class="stat-row" style="margin-top:14px">
          <div class="stat"><div class="k">CHSH value S</div><div class="v">${haveAll ? Sval.toFixed(3) : "–"}</div></div>
          <div class="stat"><div class="k">Classical max</div><div class="v">2</div></div>
          <div class="stat"><div class="k">Quantum max</div><div class="v">${(2 * Math.SQRT2).toFixed(3)}</div></div>
        </div>
        <p class="dim" style="margin-bottom:0">${haveAll
          ? "S adds up how strongly your colors agreed for each coin pair, counting the Tails + Tails pair against you. It's the standard measure of correlation for this game: win rate = 1/2 + S/8 on average."
          : "S needs at least one round of every coin pair. Play more rounds to see it."}</p>
      </section>
      ${S.simulated ? "" : `<details class="panel"><summary>Round by round</summary><div class="scroll-x"><table class="case-table log">
        <thead><tr><th>#</th><th>A coin</th><th>B coin</th>${quantum ? "<th>A dial</th><th>B dial</th>" : ""}<th>A</th><th>B</th><th>Point</th></tr></thead>
        <tbody>${H.map((r, i) => `<tr><td>${i + 1}</td><td>${COIN[r.x][0]}</td><td>${COIN[r.y][0]}</td>${quantum ? `<td>${r.ta}°</td><td>${r.tb}°</td>` : ""}<td>${COLOR[r.a]}</td><td>${COLOR[r.b]}</td><td>${wins(r.x, r.y, r.a, r.b) ? "✓" : "–"}</td></tr>`).join("")}</tbody>
      </table></div></details>`}
      <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
        ${S.simulated ? "" : '<button class="btn primary" id="again">Play again</button>'}
        <button class="btn" id="setup">${S.simulated ? "Back to setup" : "Change settings"}</button>
      </div>
    </div>`;
    if (!S.simulated) $("#again", root).onclick = () => { S = { names: S.names, total: S.total, history: [], lastAngle: S.lastAngle, cur: null }; startRound(); };
    $("#setup", root).onclick = setup;
  }

  /* ---------- measurement dial ---------- */
  function makeDial(start) {
    let theta = start;
    const el = h(`<div class="dial-wrap">
      <div class="dim">Set your measurement angle</div>
      <svg class="dial" viewBox="-110 -110 220 220" role="img" aria-label="Measurement dial">
        <circle r="100" fill="#16243f" stroke="#2b4270" stroke-width="2"/>
        ${Array.from({ length: 24 }, (_, i) => { const a = i * 15, r1 = a % 45 ? 92 : 86, rad = (a * Math.PI) / 180;
          return `<line x1="${(Math.sin(rad) * r1).toFixed(1)}" y1="${(-Math.cos(rad) * r1).toFixed(1)}" x2="${(Math.sin(rad) * 99).toFixed(1)}" y2="${(-Math.cos(rad) * 99).toFixed(1)}" stroke="#93a1bd" stroke-width="${a % 45 ? 1 : 2}"/>`; }).join("")}
        <g class="needle"><line x1="0" y1="-88" x2="0" y2="88" stroke="#5ad1a6" stroke-width="6" stroke-linecap="round"/><circle r="9" fill="#e8b931"/></g>
        ${[0, 45, 90, 135].map((a) => { const rad = (a * Math.PI) / 180; return `<text x="${(Math.sin(rad) * 72).toFixed(1)}" y="${(-Math.cos(rad) * 72 + 4).toFixed(1)}" fill="#93a1bd" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace" stroke="#16243f" stroke-width="4" paint-order="stroke" pointer-events="none">${a}°</text>`; }).join("")}
      </svg>

const SL=[["lambda","λ","Forgetting","Pull of every feeling back toward neutral.",0,0.02,0.0005],

  ["bias","b","In-group bias","How much lineage resemblance colors a first meeting.",0,1,0.05],
  ["scarcity","s","Scarcity","How slowly fruit grows back.",0,1,0.05],

  ["tau","τ","Territoriality","How much where you stand matters: home advantage, defending ground, patrols, resentment of intruders. 0 gives v1.1 behavior.",0,1,0.05],
  ["bond","ψ","Bond memory","How strongly a long shared history holds a feeling in place while two animals are apart.",0,1,0.05],

  ["assess","q","Assessment","How carefully animals weigh the odds before fighting. They attack only with a clear advantage, face off when evenly matched, and back down from stronger sides. 0 means every hostile encounter is a fight.",0,1,0.05],

  ["read","ω","Readability","How accurately animals read how others feel about them. Below 1, each one infers support from contact and from who sides with whom, and otherwise assumes its feelings are returned. 1 means everyone knows exactly.",0,1,0.05],

function troopGame(root) {
  if (!document.getElementById("troop-fonts")) {
    const l = document.createElement("link");
    l.id = "troop-fonts"; l.rel = "stylesheet"; l.href = TROOP.fonts;
    document.head.append(l);
  }
  const host = document.createElement("div");
  root.append(host);
  const R = host.attachShadow({ mode: "open" });
  R.innerHTML = `<style>${TROOP.css}</style>${TROOP.html}`;
  let alive = true;
  const winListeners = [];
  // Stand-ins so the simulation's lookups resolve inside its shadow root.
  const doc = {
    getElementById: (id) => R.getElementById(id),
    querySelector: (s) => R.querySelector(s),
    querySelectorAll: (s) => R.querySelectorAll(s),
    addEventListener: (t, f, o) => R.addEventListener(t, f, o),
    createElement: (t) => document.createElement(t),
    fonts: document.fonts,
    body: document.body,
    documentElement: host,
  };
  const win = {
    get devicePixelRatio() { return window.devicePixelRatio; },
    get claude() { return window.claude; },   // file saving goes through the shelf's `downloads` capability
    addEventListener: (t, f, o) => { window.addEventListener(t, f, o); winListeners.push([t, f]); },
  };
  const raf = (f) => { if (alive) requestAnimationFrame(() => { if (alive) f(); }); };
  troopRun(doc, win, raf);
  return { unmount() { alive = false; winListeners.forEach(([t, f]) => window.removeEventListener(t, f)); } };
}
